name: Build Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ------------------------
      # BACKEND
      # ------------------------
      - name: Install Backend Dependencies
        working-directory: "Website final/backend"
        run: npm install --legacy-peer-deps

      - name: Build Backend
        working-directory: "Website final/backend"
        run: npm run build --if-present

      # ------------------------
      # FRONTEND
      # ------------------------
      - name: Install Frontend Dependencies
        working-directory: "Website final/frontend"
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        working-directory: "Website final/frontend"
        env:
          VITE_API_URL: "http://localhost:5000/api/v1"
        run: npm run build

      - name: Done
        run: echo "Backend & Frontend compiled successfully!"
